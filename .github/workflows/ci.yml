name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Roslyn asmdef compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile Runtime + Editor against Unity stubs
        shell: bash
        run: |
          set +e
          dotnet run --project tools/RoslynCheck -- editor 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::RoslynCheck exited with code $status"
            tail -n 40 build.log | sed 's/^/::error::/'
            exit "$status"
          fi

  package:
    name: Package consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package.json, README and CHANGELOG
        run: python3 tools/ci/release.py verify
